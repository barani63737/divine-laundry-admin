<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Sign in')}"></head>
<body class="login-page">
<main class="login-shell">
	<section class="login-brand-panel" aria-label="Divine Laundry admin portal">
		<div class="login-brand-panel-content">
			<div class="login-brand login-brand-light">
				<span class="logo" aria-hidden="true">D</span>
				<span><strong>Divine Laundry</strong><small>ADMIN PORTAL</small></span>
			</div>
			<p>Manage every order and garment from one clean workspace.</p>
		</div>
	</section>
	<section class="login-panel" aria-labelledby="login-title">
		<div class="login-card">
			<div class="login-brand-compact" aria-hidden="true">
				<span class="logo">D</span>
				<span><strong>Divine Laundry</strong><small>ADMIN PORTAL</small></span>
			</div>
			<div class="login-heading">
				<h2 id="login-title">Welcome back</h2>
				<p>Sign in to access your workspace.</p>
			</div>
			<div class="alert error login-alert" th:if="${param.error}" role="alert">
				<span class="alert-icon" aria-hidden="true">!</span><span>Incorrect username or password.</span>
			</div>
			<div class="alert login-alert login-alert-success" th:if="${param.logout}" role="status">
				<span class="alert-icon" aria-hidden="true">&#10003;</span><span>You have signed out.</span>
			</div>
			<form class="login-form" th:action="@{/login}" method="post" data-login-form>
				<label for="username">Username</label>
				<div class="input-wrap">
					<span class="input-icon" aria-hidden="true">@</span>
					<input id="username" name="username" autocomplete="username" required autofocus aria-describedby="username-hint">
				</div>
				<small id="username-hint" class="field-hint">Use your administrator username.</small>

				<label for="password">Password</label>
				<div class="input-wrap password-field">
					<span class="input-icon input-lock" aria-hidden="true">&#9679;</span>
					<input id="password" name="password" type="password" autocomplete="current-password" required>
					<button class="password-toggle" type="button" data-password-toggle aria-controls="password" aria-label="Show password" title="Show password">
						<svg class="password-toggle-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M3 12s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6Z"></path><circle cx="12" cy="12" r="2.5"></circle></svg>
					</button>
				</div>

				<button class="login-submit" type="submit" data-login-submit>
					<span data-submit-label>Sign in</span><span class="submit-arrow" aria-hidden="true">&#8594;</span>
				</button>
			</form>
			<p class="login-footnote"><svg aria-hidden="true" viewBox="0 0 24 24" focusable="false"><path d="M7 10V8a5 5 0 0 1 10 0v2M6 10h12v10H6z"></path></svg> Secure admin access</p>
		</div>
	</section>
</main>

</body></html>
