spring:
  application:
    name: divine-laundry-admin-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/divine_laundry?connectionTimeZone=UTC}
    username: ${DB_USERNAME:laundry_app}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        type:
          preferred_instant_jdbc_type: TIMESTAMP
        jdbc:
          time_zone: UTC
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    url: ${FLYWAY_DB_URL:${DB_URL:jdbc:mysql://localhost:3306/divine_laundry?connectionTimeZone=UTC}}
    user: ${FLYWAY_DB_USERNAME:${DB_USERNAME:laundry_app}}
    password: ${FLYWAY_DB_PASSWORD:${DB_PASSWORD}}

server:
  port: ${SERVER_PORT:${PORT:8080}}
  error:
    include-message: never
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  business-zone: ${BUSINESS_ZONE:Asia/Kolkata}
  business:
    name: ${BUSINESS_NAME:Divine Laundry Trichy}
    phone: ${BUSINESS_PHONE:+91 00000 00000}
    address: ${BUSINESS_ADDRESS:Trichy, Tamil Nadu}
    gst-number: ${BUSINESS_GST_NUMBER:}
  payment:
    upi-id: ${UPI_ID:}
    upi-payee-name: ${UPI_PAYEE_NAME:Divine Laundry Trichy}
  whatsapp:
    enabled: ${WHATSAPP_ENABLED:false}
    graph-base-url: ${WHATSAPP_GRAPH_BASE_URL:https://graph.facebook.com}
    graph-api-version: ${WHATSAPP_GRAPH_API_VERSION:}
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
    access-token: ${WHATSAPP_ACCESS_TOKEN:}
    template-name: ${WHATSAPP_TEMPLATE_NAME:laundry_invoice_payment}
    template-language: ${WHATSAPP_TEMPLATE_LANGUAGE:en}
    document-template-name: ${WHATSAPP_DOCUMENT_TEMPLATE_NAME:}
    document-template-language: ${WHATSAPP_DOCUMENT_TEMPLATE_LANGUAGE:en}
    pending-timeout: ${WHATSAPP_PENDING_TIMEOUT:PT15M}
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD}
  web-origin: ${WEB_ORIGIN:http://localhost:5173}

razorpay:
  enabled: ${RAZORPAY_ENABLED:false}
  base-url: ${RAZORPAY_BASE_URL:https://api.razorpay.com}
  key-id: ${RAZORPAY_KEY_ID:}
  key-secret: ${RAZORPAY_KEY_SECRET:}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
